name: Corventis
description: 'Corventis, Inc. was a healthcare technology company that developed wearable
  cardiac monitoring devices — including the PiiX adhesive sensor and the NUVANT Mobile
  Cardiac Telemetry (MCT) system — for remote patient monitoring and arrhythmia detection.
  Backed by Kleiner Perkins, the company was acquired by Medtronic in 2014 and no longer
  operates as an independent entity. The corventis.com domain now resolves to Medtronic
  infrastructure (Medtronic nameservers; TLS certificate scoped to Medtronic domains).
  No public developer portal, API documentation, SDK, or machine-readable API surface
  exists for this provider.'
